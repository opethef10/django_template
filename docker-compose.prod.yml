name: ${PROJECT_SLUG}-prod

services:
  django_app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: ${PROJECT_SLUG}:prod
    container_name: ${PROJECT_SLUG}-prod
    env_file: .env
    ports:
      - "${PROJECT_PORT_PROD:-8000}:8000"
    volumes:
      - prod_data:/app/var
      - backup_data:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  prod_data:
  backup_data:
